<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Analysis</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background:#0b0c10;
      color:#e9f5f5;
      font-family:Inter, sans-serif;
      padding:20px;
    }
  </style>
</head>

<body class="flex justify-center">
<div class="max-w-5xl w-full bg-gray-900 bg-opacity-70 p-8 rounded-2xl shadow-xl">

  <h1 class="text-center text-3xl font-bold mb-6 text-teal-400">
    Colorized Image Analysis
  </h1>

  <div id="status" class="text-center text-gray-300 mb-4"></div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <div class="flex flex-col items-center">
      <h2 class="text-xl font-semibold mb-2">Colorized Image</h2>
      <img id="colorizedImg" class="rounded-lg shadow-lg border border-gray-700 max-h-96">
    </div>

    <div class="flex flex-col items-center">
      <h2 class="text-xl font-semibold mb-2">K-Means Segmented</h2>
      <img id="kmeansImg" class="rounded-lg shadow-lg border border-gray-700 max-h-96">
    </div>

  </div>

  <div class="mt-8 p-6 bg-gray-800 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold text-purple-300 mb-4 text-center">Cluster Analysis</h2>
    <div id="cluster_output" class="text-gray-300 leading-relaxed"></div>

    <h2 class="text-2xl font-bold text-pink-300 mt-8 mb-4 text-center">Summary</h2>
    <div id="summary_output" class="text-gray-300 leading-relaxed"></div>
  </div>

  <div class="text-center mt-8 flex flex-col items-center gap-4">
    <button id="downloadPdfBtn"
            class="inline-block px-6 py-3 bg-teal-500 text-white rounded-xl hover:bg-teal-600"
            onclick="downloadPDF()">
      ⬇ Download PDF Report
    </button>

    <a href="/" class="text-teal-300 underline text-lg hover:text-teal-400">
      ⬅ Back to Home
    </a>
  </div>

</div>

<script>
const statusBox = document.getElementById("status");
const colorizedImg = document.getElementById("colorizedImg");
const kmeansImg = document.getElementById("kmeansImg");
const clusterOut = document.getElementById("cluster_output");
const summaryOut = document.getElementById("summary_output");
const downloadBtn = document.getElementById("downloadPdfBtn");

// AUTO ANALYSIS WHEN PAGE LOADS
(async function autoProcess(){
  const params = new URLSearchParams(window.location.search);
  const filename = params.get("file");

  if (!filename) {
    statusBox.textContent = "Error: No file received.";
    return;
  }

  statusBox.textContent = "Loading colorized image...";
  colorizedImg.src = "/forwarded/" + filename;

  // Run KMeans
  statusBox.textContent = "Running K-Means...";
  let fd = new FormData();
  fd.append("filename", filename);
  fd.append("k", 4);
  fd.append("resize", 256);

  try {
    let km = await fetch("/kmeans", { method:"POST", body:fd });
    let kmj = await km.json();
    if (kmj.seg_public_url) kmeansImg.src = kmj.seg_public_url;
  } catch (e) {
    console.warn("KMeans failed:", e);
    statusBox.textContent = "KMeans failed (see console).";
  }

  // Run Classification
  statusBox.textContent = "Running classification...";
  try {
    let clf = await fetch("/classify?image=" + encodeURIComponent(filename));
    let clj = await clf.json();
    if (clj.cluster_bullets) clusterOut.innerHTML = clj.cluster_bullets;
    if (clj.summary_bullets) summaryOut.innerHTML = clj.summary_bullets;
    statusBox.textContent = "Analysis complete!";
  } catch (e) {
    console.warn("Classification failed:", e);
    statusBox.textContent = "Classification failed (see console).";
  }
})();

async function downloadPDF() {
  const params = new URLSearchParams(window.location.search);
  const filename = params.get("file");
  if (!filename) {
    alert("No file specified for PDF generation.");
    return;
  }
  downloadBtn.disabled = true;
  downloadBtn.textContent = "Generating PDF...";

  try {
    const resp = await fetch("/generate_pdf?file=" + encodeURIComponent(filename) + "&k=4");
    if (!resp.ok) {
      const j = await resp.json().catch(()=>null);
      const err = j?.error || `Server returned ${resp.status}`;
      alert("PDF generation failed: " + err);
      return;
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename.replace(/\.[^.]+$/, '') + "_analysis.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert("PDF error: " + err.message);
  } finally {
    downloadBtn.disabled = false;
    downloadBtn.textContent = "⬇ Download PDF Report";
  }
}
</script>

</body>
</html>
